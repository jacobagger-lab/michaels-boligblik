name: Michaels morgenoverblik
on:
  schedule:
    # UTC covers Danish summer and winter time; morning.py checks local hours.
    - cron: '17 4-20 * * *'
  workflow_dispatch:
    inputs:
      automatic:
        description: Startet af cloud-timeren
        type: boolean
        default: false
      force_refresh:
        description: Kontrollér hele opdateringen selv om dagens data er hentet
        type: boolean
        default: false
      first_publish:
        description: Tillad første indlæsning hvis der endnu ikke findes boligdata
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: boligblik-pages
  cancel-in-progress: false

jobs:
  opdater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.previous.outputs.publish }}
      receipt: ${{ steps.collect.outputs.receipt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Kontrollér hvilket overblik der faktisk er offentligt
        id: previous
        env:
          AUTOMATIC: ${{ github.event_name == 'schedule' || inputs.automatic }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          FIRST_PUBLISH: ${{ inputs.first_publish }}
          PUBLISHED_URL: https://jacobagger-lab.github.io/michaels-boligblik/boliger.json
        run: |
          if [[ "$AUTOMATIC" == true ]] && ! python3 scripts/morning.py within-hours; then
            echo "Uden for dansk opdateringstid"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          status=$(curl -sSL --retry 3 --retry-all-errors --max-time 30 \
            --output "$RUNNER_TEMP/previous.json" --write-out '%{http_code}' \
            "$PUBLISHED_URL?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          case "$status" in
            200) if [[ "$AUTOMATIC" == true && "$FORCE_REFRESH" != true ]] && python3 scripts/morning.py current "$RUNNER_TEMP/previous.json"; then
                   echo "Alle kilder er allerede hentet i morges"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
                 fi ;;
            404) if [[ "$FIRST_PUBLISH" != true ]]; then echo "::error::Sidste boligoversigt mangler"; exit 1; fi
                 rm "$RUNNER_TEMP/previous.json" ;;
            *)   echo "::error::Kunne ikke hente sidste overblik (HTTP $status)"; exit 1 ;;
          esac
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Genbrug kontrollerede placeringer uden for søgeområdet
        if: steps.previous.outputs.publish == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bolig-geo
          key: bolig-geo-${{ hashFiles('scripts/geo.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bolig-geo-${{ hashFiles('scripts/geo.py') }}-
      - name: Kontrollér historik, og hent villaer fra mæglerne
        if: steps.previous.outputs.publish == 'true'
        id: collect
        env:
          BOLIG_GEO_CACHE: ${{ runner.temp }}/bolig-geo
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          prior=()
          if [[ -f "$RUNNER_TEMP/previous.json" ]]; then prior=(--previous "$RUNNER_TEMP/previous.json"); fi
          python3 scripts/refresh.py "${prior[@]}" --output public/boliger.json
          echo "receipt=$(python3 scripts/morning.py receipt public/boliger.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        if: steps.previous.outputs.publish == 'true'
        with:
          path: public
          retention-days: 1
  udgiv:
    needs: opdater
    if: needs.opdater.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Udgiv det kontrollerede overblik
        id: deployment
        uses: actions/deploy-pages@v5
  drift:
    needs: [opdater, udgiv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Gem kildestatus og antal boliger for den offentliggjorte opdatering
        env:
          RECEIPT: ${{ needs.opdater.outputs.receipt }}
          AUTOMATIC: ${{ github.event_name == 'schedule' || inputs.automatic }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          verified=false
          for attempt in 1 2 3 4; do
            if curl -fsSL --retry 2 --retry-all-errors --max-time 30 \
              "https://jacobagger-lab.github.io/michaels-boligblik/boliger.json?verify=$GITHUB_RUN_ID-$attempt" \
              --output "$RUNNER_TEMP/published.json" && \
              python3 scripts/morning.py verify "$RUNNER_TEMP/published.json"; then
              verified=true; break
            fi
            if [[ "$attempt" != 4 ]]; then sleep 10; fi
          done
          if [[ "$verified" != true ]]; then echo "::error::Udgivne data kunne ikke bekræftes"; exit 1; fi
          mkdir -p drift
          python3 scripts/morning.py audit "$RUNNER_TEMP/published.json" > drift/seneste.json
          git add drift/seneste.json
          if ! git diff --cached --quiet; then
            git -c user.name='Michaels boligblik' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Opdatér driftstal for Michaels boligblik"
            git push origin HEAD:main
          fi
      - name: Markér forsinkede kilder til næste automatiske forsøg
        if: github.event_name == 'schedule' || inputs.automatic
        env:
          RECEIPT: ${{ needs.opdater.outputs.receipt }}
        run: |
          python3 - <<'PYTHON'
          import json,os,sys
          failed = [name for name, info in json.loads(os.environ["RECEIPT"])["sources"].items() if info["status"] != "ok"]
          if failed:
              sys.exit("Forsinkede mæglere; nyt forsøg næste time: " + ", ".join(failed))
          PYTHON
